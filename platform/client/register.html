<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 分科自选 SaaS 平台</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, #0f172a 0%, #1a1a2e 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    .login-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .login-subtitle {
      color: var(--text-secondary);
    }
    .form-footer {
      margin-top: 1rem;
      text-align: center;
      color: var(--text-secondary);
    }
    .captcha-group {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    .captcha-group .form-input {
      flex: 1;
    }
    .captcha-question {
      background: var(--bg-hover);
      padding: 0.875rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      color: var(--primary-light);
      min-width: 100px;
      text-align: center;
    }
    .captcha-refresh {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.5rem;
      font-size: 1.2rem;
    }
    .captcha-refresh:hover {
      color: var(--text-primary);
    }
    .registration-closed {
      text-align: center;
      padding: 3rem 1rem;
    }
    .registration-closed-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .registration-closed h2 {
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .registration-closed p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🎓</div>
        <h1 class="login-title">创建账号</h1>
        <p class="login-subtitle">分科自选 SaaS 平台</p>
      </div>

      <!-- 注册关闭提示 -->
      <div id="registrationClosed" class="registration-closed hidden">
        <div class="registration-closed-icon">🚫</div>
        <h2>注册已关闭</h2>
        <p>当前系统不接受新用户注册，请联系管理员。</p>
        <a href="login.html" class="btn btn-primary">返回登录</a>
      </div>

      <!-- 注册表单 -->
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="email" id="email" class="form-input" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">姓名</label>
          <input type="text" id="name" class="form-input" required placeholder="请输入您的姓名">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" id="password" class="form-input" required placeholder="请设置密码">
          <!-- 密码强度指示器容器 -->
          <div id="passwordStrengthContainer"></div>
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" id="confirmPassword" class="form-input" required placeholder="请再次输入密码">
        </div>
        <div class="form-group hidden" id="captchaGroup">
          <label class="form-label">验证码</label>
          <div class="captcha-group">
            <span class="captcha-question" id="captchaQuestion">加载中...</span>
            <input type="text" id="captchaAnswer" class="form-input" placeholder="答案">
            <button type="button" class="captcha-refresh" onclick="loadCaptcha()" title="刷新验证码">🔄</button>
          </div>
        </div>
        <input type="hidden" id="captchaId">
        <button type="submit" class="btn btn-success" style="width: 100%;">注册</button>
      </form>

      <div class="form-footer" id="formFooter">
        已有账号？<a href="login.html" style="color: var(--primary-light);">立即登录</a>
      </div>
    </div>
  </div>

  <script src="/js/csrf.js"></script>
  <script src="/js/passwordStrength.js"></script>
  <script>
    let captchaEnabled = false;
    let registerPasswordStrength = null;

    // 检查注册状态
    async function checkRegistrationStatus() {
      try {
        const response = await fetch('/api/auth/registration-status');
        const result = await response.json();

        if (result.code === 200) {
          if (!result.data.registrationOpen) {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('formFooter').classList.add('hidden');
            document.getElementById('registrationClosed').classList.remove('hidden');
            return;
          }

          captchaEnabled = result.data.captchaEnabled;
          if (captchaEnabled) {
            document.getElementById('captchaGroup').classList.remove('hidden');
            loadCaptcha();
          }
          
          // 初始化密码强度指示器
          setTimeout(() => {
            registerPasswordStrength = new PasswordStrengthIndicator({
              passwordInput: document.getElementById('password'),
              confirmInput: document.getElementById('confirmPassword'),
              container: document.getElementById('passwordStrengthContainer')
            });
          }, 100);
        }
      } catch (error) {
        console.error('检查注册状态失败:', error);
      }
    }

    // 加载验证码
    async function loadCaptcha() {
      try {
        const response = await fetch('/api/auth/captcha');
        const result = await response.json();

        if (result.code === 200) {
          document.getElementById('captchaId').value = result.data.captchaId;
          document.getElementById('captchaQuestion').textContent = result.data.question;
          document.getElementById('captchaAnswer').value = '';
        }
      } catch (error) {
        console.error('加载验证码失败:', error);
        document.getElementById('captchaQuestion').textContent = '加载失败';
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const name = document.getElementById('name').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('两次输入的密码不一致');
        return;
      }

      // 验证密码强度
      if (registerPasswordStrength && !registerPasswordStrength.isValid()) {
        const errors = registerPasswordStrength.getErrors();
        alert('密码不符合安全要求：\n\n' + errors.join('\n'));
        return;
      }

      const body = { email, name, password };

      if (captchaEnabled) {
        const captchaId = document.getElementById('captchaId').value;
        const captchaAnswer = document.getElementById('captchaAnswer').value;

        if (!captchaAnswer) {
          alert('请输入验证码');
          return;
        }

        body.captchaId = captchaId;
        body.captchaAnswer = captchaAnswer;
      }

      try {
        const csrfToken = getCsrfToken();
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify(body)
        });

        const result = await response.json();

        if (result.code === 200) {
          alert('注册成功！');
          localStorage.setItem('platform_token', result.data.token);
          localStorage.setItem('platform_user', JSON.stringify(result.data.user));
          window.location.href = 'dashboard.html';
        } else {
          alert(result.message || '注册失败');
          if (captchaEnabled) {
            loadCaptcha(); // 刷新验证码
          }
        }
      } catch (error) {
        console.error('注册错误:', error);
        alert('注册失败，请稍后重试');
        if (captchaEnabled) {
          loadCaptcha();
        }
      }
    });

    checkRegistrationStatus();
  </script>
</body>
</html>
