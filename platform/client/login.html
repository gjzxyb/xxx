<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 分科自选 SaaS 平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--gradient-bg);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(124, 58, 237, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 80px;
      height: 80px;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      font-family: 'Orbitron', sans-serif;
    }
    .login-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      font-family: 'Orbitron', sans-serif;
    }
    .login-subtitle {
      color: var(--text-secondary);
    }
    .form-footer {
      margin-top: 1rem;
      text-align: center;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🎓</div>
        <h1 class="login-title">欢迎登录</h1>
        <p class="login-subtitle">分科自选 SaaS 平台</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="email" id="email" class="form-input" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" id="password" class="form-input" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
      </form>

      <div class="form-footer">
        还没有账号？<a href="register.html" style="color: var(--primary-light);">立即注册</a>
      </div>
    </div>
  </div>

  <script>
    // 获取 CSRF Token
    function getCsrfToken() {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        const [name, value] = cookie.trim().split('=');
        if (name === 'CSRF-TOKEN') {
          return value;
        }
      }
      return null;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const csrfToken = getCsrfToken();
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.code === 200) {
          localStorage.setItem('platform_token', result.data.token);
          localStorage.setItem('platform_user', JSON.stringify(result.data.user));

          if (result.data.user.isSuperAdmin) {
            window.location.href = 'superadmin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        } else {
          alert(result.message || '登录失败');
        }
      } catch (error) {
        console.error('登录错误:', error);
        alert('登录失败，请稍后重试');
      }
    });
  </script>
</body>
</html>
