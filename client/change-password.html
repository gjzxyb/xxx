<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改密码 - 分科自选系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="/js/csrf.js"></script>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="/dashboard.html" class="navbar-brand">
        📚 <span>分科自选系统</span>
      </a>
      <div class="navbar-nav">
        <div class="nav-user">
          <div class="nav-user-avatar" style="background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);">S</div>
          <span id="userName">学生</span>
          <a href="#" id="logoutBtn" style="color: var(--text-muted); margin-left: 0.5rem;">退出</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <div class="container">
      <div class="card" style="max-width: 600px; margin: 2rem auto;">
        <div class="card-header">
          <h2 class="card-title">🔐 修改密码</h2>
          <a href="/dashboard.html" class="btn btn-secondary btn-sm">返回</a>
        </div>

        <div id="alertBox" class="alert hidden"></div>

        <form id="changePasswordForm">
          <div class="form-group">
            <label class="form-label">原密码 *</label>
            <input type="password" id="oldPassword" class="form-input" placeholder="请输入原密码" required>
          </div>

          <div class="form-group">
            <label class="form-label">新密码 *</label>
            <input type="password" id="newPassword" class="form-input" placeholder="请输入新密码" required>
            <!-- 密码强度指示器容器 -->
            <div id="passwordStrengthContainer"></div>
          </div>

          <div class="form-group">
            <label class="form-label">确认新密码 *</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入新密码" required>
          </div>

          <div class="alert alert-info" style="margin-top: 1.5rem;">
            <strong>温馨提示：</strong>
            <ul style="margin: 0.5rem 0 0 1.5rem; padding: 0;">
              <li>密码修改后将立即生效</li>
              <li>请妥善保管您的新密码</li>
              <li>如遗忘密码，请联系管理员重置</li>
            </ul>
          </div>

          <div class="flex gap-2" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">
              确认修改
            </button>
            <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="window.history.back()">
              取消
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/passwordStrength.js"></script>
  <script>
    // 检查登录状态
    if (!isLoggedIn()) {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('projectId');
      window.location.href = projectId ? `/?projectId=${projectId}` : '/';
    }

    const user = getCurrentUser();
    if (user) {
      document.getElementById('userName').textContent = user.name;
    }

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      clearToken();
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('projectId');
      window.location.href = projectId ? `/?projectId=${projectId}` : '/';
    });

    const alertBox = document.getElementById('alertBox');

    // 显示提示
    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.classList.remove('hidden');
      setTimeout(() => alertBox.classList.add('hidden'), 5000);
    }

    // 初始化密码强度指示器
    const passwordStrength = new PasswordStrengthIndicator({
      passwordInput: document.getElementById('newPassword'),
      confirmInput: document.getElementById('confirmPassword'),
      container: document.getElementById('passwordStrengthContainer')
    });

    // 表单提交
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // 基本验证
      if (!oldPassword || !newPassword || !confirmPassword) {
        showAlert('请填写所有必填项');
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert('两次密码输入不一致');
        return;
      }

      if (oldPassword === newPassword) {
        showAlert('新密码不能与原密码相同');
        return;
      }

      // 验证密码强度
      if (!passwordStrength.isValid()) {
        const errors = passwordStrength.getErrors();
        showAlert('新密码不符合要求：\n' + errors.join('、'));
        return;
      }

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = '修改中...';

      try {
        const result = await api.auth.changePassword(oldPassword, newPassword);

        if (result.code === 200) {
          showAlert('密码修改成功！即将跳转...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 2000);
        } else {
          showAlert(result.message || '密码修改失败');
          btn.disabled = false;
          btn.textContent = '确认修改';
        }
      } catch (error) {
        console.error('修改密码错误:', error);
        showAlert('修改失败，请稍后重试');
        btn.disabled = false;
        btn.textContent = '确认修改';
      }
    });
  </script>
</body>
</html>
