<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的项目 - 分科自选 SaaS 平台</title>
  <link rel="stylesheet" href="/platform/css/style.css">
  <link rel="stylesheet" href="/platform/css/dashboard.css">
  <script src="/js/csrf.js"></script>
  <script src="/js/safeDOM.js"></script>
  <script src="/js/passwordStrength.js"></script>
</head>
<body>
  <div class="dashboard-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <span>SaaS 平台</span>
      </div>

      <ul class="nav-menu">
        <li class="nav-item active">
          <span>📊</span> 我的项目
        </li>
<li class="nav-item" id="createProjectNavBtn">
          <span>➕</span> 创建项目
        </li>
        <li class="nav-item" id="accountSettingsNavBtn">
          <span>⚙️</span> 账号设置
        </li>
      </ul>

      <div class="user-profile">
        <div class="user-avatar" id="userAvatar">U</div>
        <div style="flex: 1; overflow: hidden;">
          <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 0.8rem; color: var(--text-secondary);" id="userPlan">加载中...</div>
        </div>
<button class="btn-icon" id="logoutBtn" title="退出" style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">
          ⏻
        </button>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content">
      <header class="header">
        <div class="page-title">
          <h1>我的项目</h1>
          <p>管理您的分科自选系统实例</p>
        </div>
<button class="btn btn-primary" id="createProjectHeaderBtn">
          <span>+</span> 创建新项目
        </button>
      </header>

      <!-- 统计卡片 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="projectCount">0</div>
          <div class="stat-label">已创建项目</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="maxProjects">0</div>
          <div class="stat-label">项目配额</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="collaboratedProjects">0</div>
          <div class="stat-label">协作项目</div>
        </div>
      </div>

      <!-- 项目列表 -->
      <div class="section-header">
        <h2 style="font-size: 1.25rem;">全部项目</h2>
        <div class="filter-tabs" style="display: flex; gap: 1rem;">
          <!-- Placeholder for filters if needed -->
        </div>
      </div>

      <div class="projects-grid" id="projectList">
        <!-- Projects will be loaded here -->
      </div>
    </main>
  </div>

  <!-- 创建项目弹窗 -->
  <div class="modal-overlay" id="createProjectModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">✨ 创建新项目</h3>
        <button class="modal-close" id="createProjectModalCloseBtn">&times;</button>
      </div>
      <form id="createProjectForm">
        <div class="form-group">
          <label class="form-label">项目名称</label>
          <input type="text" id="projectName" class="form-input" required placeholder="例如：XX中学分科系统">
        </div>
        <div class="form-group">
          <label class="form-label">项目描述</label>
          <textarea id="projectDesc" class="form-input" rows="3" placeholder="简要描述该项目的用途..."></textarea>
        </div>
        <div class="flex justify-between" style="margin-top: 2rem;">
          <button type="button" class="btn btn-secondary" id="createProjectModalCancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">立即创建</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 安全设置弹窗 -->
  <div class="modal-overlay" id="securityModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">🔐 安全设置</h3>
        <button class="modal-close" id="securityModalCloseBtn">&times;</button>
      </div>
      <form id="securityForm">
        <input type="hidden" id="securityProjectId">
        <h4 style="margin-bottom: 1rem; color: var(--text-primary);">管理员凭据</h4>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">设置协作系统的管理员登录账号密码</p>
        <div class="form-group">
          <label class="form-label">管理员账号（邮箱）</label>
          <input type="email" id="adminUsername" class="form-input" required placeholder="例如：admin@example.com">
          <small style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem; display: block;">
            请输入邮箱地址，需符合平台邮箱域名限制
          </small>
        </div>
        <div class="form-group">
          <label class="form-label">管理员密码</label>
          <input type="password" id="adminPassword" class="form-input" required placeholder="8-32字符，含大小写字母和数字">
          <!-- 密码强度指示器容器 -->
          <div id="adminPasswordStrengthContainer"></div>
        </div>
        <div class="flex justify-between" style="margin-top: 2rem;">
          <button type="button" class="btn btn-secondary" id="securityModalCancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存设置</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 账号设置弹窗 -->
  <div class="modal-overlay" id="accountSettingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">⚙️ 账号设置</h3>
        <button class="modal-close" id="accountSettingsModalCloseBtn">&times;</button>
      </div>

      <!-- 账号信息展示 -->
      <div style="margin-bottom: 2rem; padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-sm); border-left: 3px solid var(--primary);">
        <h4 style="margin-bottom: 1rem; color: var(--text-primary);">账号信息</h4>
        <div style="display: grid; gap: 0.75rem;">
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-secondary);">当前邮箱:</span>
            <span id="currentEmail" style="font-weight: 600;">-</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-secondary);">套餐级别:</span>
            <span id="currentPlan" style="font-weight: 600;">-</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--text-secondary);">项目配额:</span>
            <span id="currentQuota" style="font-weight: 600;">-</span>
          </div>
        </div>
      </div>

      <!-- 标签页切换 -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color);">
<button type="button" class="account-tab active" data-tab="email" style="flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s;">
          修改邮箱
        </button>
        <button type="button" class="account-tab" data-tab="password" style="flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s;">
          修改密码
        </button>
      </div>

      <!-- 修改邮箱表单 -->
      <form id="changeEmailForm" style="display: block;">
        <div class="form-group">
          <label class="form-label">新邮箱地址</label>
          <input type="email" id="newEmail" class="form-input" required placeholder="请输入新的邮箱地址">
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" id="emailConfirmPassword" class="form-input" required placeholder="请输入当前密码以确认修改">
        </div>
        <div class="flex justify-between" style="margin-top: 2rem;">
<button type="button" class="btn btn-secondary" id="changeEmailCancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存邮箱</button>
        </div>
      </form>

      <!-- 修改密码表单 -->
      <form id="changePasswordForm" style="display: none;">
        <div class="form-group">
          <label class="form-label">当前密码</label>
          <input type="password" id="oldPassword" class="form-input" required placeholder="请输入当前密码">
        </div>
        <div class="form-group">
          <label class="form-label">新密码</label>
          <input type="password" id="newPassword" class="form-input" required placeholder="8-32字符，含大小写字母和数字">
          <!-- 密码强度指示器容器 -->
          <div id="accountPasswordStrengthContainer"></div>
        </div>
        <div class="form-group">
          <label class="form-label">确认新密码</label>
          <input type="password" id="confirmNewPassword" class="form-input" required placeholder="请再次输入新密码">
        </div>
        <div class="flex justify-between" style="margin-top: 2rem;">
<button type="button" class="btn btn-secondary" id="changePasswordCancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存密码</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Custom Confirm Dialog -->
  <div class="modal-overlay" id="confirmDialog">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">⚠️ 确认操作</h3>
      </div>
      <div class="modal-body">
        <p id="confirmMessage" style="color: var(--text-primary); margin-bottom: 1.5rem;"></p>
      </div>
      <div class="flex justify-between" style="margin-top: 1.5rem;">
        <button type="button" class="btn btn-secondary" id="confirmCancel">取消</button>
        <button type="button" class="btn btn-danger" id="confirmOk">确认</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // 全局变量声明
    let adminPasswordStrength = null;
    let accountPasswordStrength = null;
    let allowedEmailDomains = [];

    // Custom Confirm Dialog
    function showConfirm(message) {
      return new Promise((resolve) => {
        const dialog = document.getElementById('confirmDialog');
        const messageEl = document.getElementById('confirmMessage');
        const okBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');

        messageEl.textContent = message;
        dialog.classList.add('active');

        function cleanup() {
          dialog.classList.remove('active');
          okBtn.removeEventListener('click', handleOk);
          cancelBtn.removeEventListener('click', handleCancel);
        }

        function handleOk() {
          cleanup();
          resolve(true);
        }

        function handleCancel() {
          cleanup();
          resolve(false);
        }

        okBtn.addEventListener('click', handleOk);
        cancelBtn.addEventListener('click', handleCancel);
      });
    }

    // Override confirm to use custom dialog
    window.confirm = showConfirm;

    // Toast utility function
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      const icons = {
        success: '✓',
        error: '✗',
        warning: '⚠',
        info: 'ℹ'
      };

      toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.info}</span>
        <span class="toast-message">${message}</span>
      `;

      container.appendChild(toast);

      // Auto remove after 3 seconds
      setTimeout(() => {
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Override alert to use toast
    window.alert = function(message) {
      showToast(message, 'info');
    };

    const token = localStorage.getItem('platform_token');
    const user = JSON.parse(localStorage.getItem('platform_user') || '{}');

    if (!token) window.location.href = 'login.html';

    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();

    // 显示用户套餐信息
    const planText = user.isSuperAdmin ? '超级管理员' :
                     user.maxProjects >= 10 ? '企业版' :
                     user.maxProjects >= 5 ? '专业版' :
                     `标准版 (${user.maxProjects}个项目)`;
    document.getElementById('userPlan').textContent = planText;

    // ========== 模态框函数定义（必须在 loadProjects 之前） ==========
    
    // 加载允许的邮箱域名配置
    async function loadEmailDomainConfig() {
      try {
        const res = await fetch('/api/platform/superadmin/settings', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        
        // 如果API不存在或无权限，静默失败
        if (!res.ok) {
          allowedEmailDomains = [];
          return;
        }
        
        const result = await res.json();
        if (result.code === 200 && Array.isArray(result.data)) {
          const domainsSetting = result.data.find(s => s.key === 'allowed_email_domains');
          if (domainsSetting && domainsSetting.value) {
            allowedEmailDomains = domainsSetting.value.split(',').map(d => d.trim()).filter(d => d);
          } else {
            allowedEmailDomains = [];
          }
        } else {
          allowedEmailDomains = [];
        }
      } catch (err) {
        // 静默失败，不限制邮箱域名
        allowedEmailDomains = [];
      }
    }

    // 验证邮箱域名
    function validateEmailDomain(email) {
      if (!email || !email.includes('@')) {
        return { valid: false, message: '请输入有效的邮箱地址' };
      }

      if (allowedEmailDomains.length === 0) {
        return { valid: true };
      }

      const emailDomain = email.split('@')[1];
      if (!allowedEmailDomains.includes(emailDomain)) {
        return {
          valid: false,
          message: `邮箱域名不在允许列表中。允许的域名：${allowedEmailDomains.join(', ')}`
        };
      }

      return { valid: true };
    }

    // 显示安全设置弹窗
    function showSecurityModal(projectId) {
      console.log('[showSecurityModal] Called with projectId:', projectId);
      document.getElementById('securityProjectId').value = projectId;
      document.getElementById('adminUsername').value = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('securityModal').classList.add('active');

      // 初始化密码强度指示器
      if (adminPasswordStrength) {
        adminPasswordStrength.destroy();
      }
      adminPasswordStrength = new PasswordStrengthIndicator({
        passwordInput: document.getElementById('adminPassword'),
        container: document.getElementById('adminPasswordStrengthContainer')
      });

      // 只有超级管理员才加载邮箱域名配置
      if (user.isSuperAdmin) {
        loadEmailDomainConfig();
      } else {
        // 普通用户不限制邮箱域名
        allowedEmailDomains = [];
      }
    }

    // 关闭安全设置弹窗
    function closeSecurityModal() {
      document.getElementById('securityModal').classList.remove('active');
    }

    // 显示创建项目弹窗
    function showCreateProjectModal() {
      if (parseInt(document.getElementById('projectCount').textContent) >= user.maxProjects) {
        alert(`已达到项目数量上限（${user.maxProjects}个）`);
        return;
      }
      document.getElementById('createProjectModal').classList.add('active');
    }

    // 关闭创建项目弹窗
    function closeCreateProjectModal() {
      document.getElementById('createProjectModal').classList.remove('active');
    }

    // 显示账号设置弹窗
    function showAccountSettingsModal() {
      document.getElementById('currentEmail').textContent = user.email || '-';
      document.getElementById('currentPlan').textContent = user.plan || '免费版';
      document.getElementById('currentQuota').textContent = `${user.maxProjects || 0} 个项目`;

      document.getElementById('changeEmailForm').reset();
      document.getElementById('changePasswordForm').reset();

      switchAccountTab('email');
      document.getElementById('accountSettingsModal').classList.add('active');
    }

    // 关闭账号设置弹窗
    function closeAccountSettingsModal() {
      document.getElementById('accountSettingsModal').classList.remove('active');
      if (accountPasswordStrength) {
        accountPasswordStrength.destroy();
        accountPasswordStrength = null;
      }
    }

    // 切换账号设置标签页
    function switchAccountTab(tab) {
      document.querySelectorAll('.account-tab').forEach(t => {
        const isActive = t.dataset.tab === tab;
        t.classList.toggle('active', isActive);
        t.style.borderBottom = isActive ? '2px solid var(--primary)' : '2px solid transparent';
        t.style.color = isActive ? 'var(--primary)' : 'var(--text-secondary)';
      });

      document.getElementById('changeEmailForm').style.display = tab === 'email' ? 'block' : 'none';
      document.getElementById('changePasswordForm').style.display = tab === 'password' ? 'block' : 'none';

      if (tab === 'password') {
        if (accountPasswordStrength) {
          accountPasswordStrength.destroy();
        }
        accountPasswordStrength = new PasswordStrengthIndicator({
          passwordInput: document.getElementById('newPassword'),
          confirmInput: document.getElementById('confirmNewPassword'),
          container: document.getElementById('accountPasswordStrengthContainer')
        });
      } else {
        if (accountPasswordStrength) {
          accountPasswordStrength.destroy();
          accountPasswordStrength = null;
        }
      }
    }

    // 退出登录
    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    // ========== 项目操作函数 ==========

    async function deleteProject(id, name) {
      const confirmed = await confirm(`确定要删除项目"${name}"吗？此操作不可恢复！`);
      if (!confirmed) return;
      
      try {
        showToast('正在删除项目...', 'info');
        const res = await fetch(`/api/platform/projects/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.code === 200) {
          showToast('项目删除成功', 'success');
          loadProjects();
        } else {
          showToast(result.message || '删除失败', 'error');
        }
      } catch (err) {
        console.error('删除项目失败:', err);
        showToast('删除失败，请稍后重试', 'error');
      }
    }

    // ========== 加载项目列表 ==========
    
    async function loadProjects() {
      try {
        const response = await fetch('/api/platform/projects', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await response.json();

        if (result.code === 200) {
          const { owned, collaborated } = result.data;

          document.getElementById('projectCount').textContent = owned.length;
          document.getElementById('maxProjects').textContent = user.maxProjects;
          document.getElementById('collaboratedProjects').textContent = collaborated.length;

          const allProjects = [...owned.map(p => ({...p, type: 'owned'})), ...collaborated.map(p => ({...p, type: 'collab'}))];

          if (allProjects.length === 0) {
            const projectList = document.getElementById('projectList');
            safeDOM.empty(projectList);
            const emptyMsg = safeDOM.createElement('div', {
              className: 'empty-state',
              children: [
                safeDOM.createElement('p', { text: '还没有项目' }),
                safeDOM.createElement('p', { text: '点击右上角"新建项目"开始创建您的第一个项目' })
              ]
            });
            emptyMsg.style.cssText = 'text-align: center; padding: 4rem; color: var(--text-muted);';
            projectList.appendChild(emptyMsg);
          } else {
            const projectList = document.getElementById('projectList');
            safeDOM.empty(projectList);
            allProjects.forEach(p => {
              const statusClass = p.status === 'running' ? 'status-active' : 'status-inactive';
              const statusText = p.status === 'running' ? '运行中' : p.status === 'paused' ? '已暂停' : '已归档';

              const card = safeDOM.createElement('div', {
                className: 'project-card',
                children: [
                  safeDOM.createElement('div', {
                    className: 'project-header',
                    children: [
                      safeDOM.createElement('h3', { text: p.name }),
                      safeDOM.createElement('span', {
                        className: `status-badge ${statusClass}`,
                        text: statusText
                      })
                    ]
                  }),
                  safeDOM.createElement('div', {
                    className: 'project-body',
                    children: [
                      safeDOM.createElement('p', { text: p.description || '暂无描述' }),
                      safeDOM.createElement('div', {
                        className: 'project-stats',
                        children: [
                          safeDOM.createElement('span', { text: `👥 ${p.studentCount || 0} 学生` }),
                          safeDOM.createElement('span', { text: `📝 ${p.selectionCount || 0} 已选科` })
                        ]
                      })
                    ]
                  }),
                  safeDOM.createElement('div', {
                    className: 'project-footer',
                    children: [
                      // 进入管理按钮
                      safeDOM.createElement('button', {
                        className: 'btn btn-primary',
                        text: '进入管理',
                        on: {
                          click: async () => {
                            try {
                              // 获取项目管理员凭据
                              showToast('正在进入管理后台...', 'info');
                              const res = await fetch(`/api/platform/projects/${p.id}/admin-token`, {
                                method: 'POST',
                                headers: {
                                  'Content-Type': 'application/json',
                                  'Authorization': 'Bearer ' + token
                                }
                              });
                              const result = await res.json();
                              
                              if (result.code === 200 && result.data.token) {
                                // 保存项目 token 到 localStorage
                                localStorage.setItem('token', result.data.token);
                                localStorage.setItem('user', JSON.stringify(result.data.user));
                                // 跳转到管理后台
                                window.location.href = `/admin.html?projectId=${p.id}`;
                              } else {
                                showToast(result.message || '获取管理权限失败', 'error');
                              }
                            } catch (err) {
                              console.error('进入管理后台失败:', err);
                              showToast('进入管理后台失败，请稍后重试', 'error');
                            }
                          }
                        }
                      }),
                      // 启动/停止按钮（根据状态显示）
                      p.status === 'running' 
                        ? safeDOM.createElement('button', {
                            className: 'btn btn-warning',
                            text: '⏸ 停止',
                            on: {
                              click: () => {
                                stopProject(p.id);
                              }
                            }
                          })
                        : safeDOM.createElement('button', {
                            className: 'btn btn-success',
                            text: '▶ 启动',
                            on: {
                              click: () => {
                                startProject(p.id);
                              }
                            }
                          }),
                      // 安全设置按钮
                      safeDOM.createElement('button', {
                        className: 'btn btn-secondary',
                        text: '🔐 设置',
                        on: {
                          click: () => {
                            showSecurityModal(p.id);
                          }
                        }
                      }),
                      // 删除按钮
                      safeDOM.createElement('button', {
                        className: 'btn btn-danger',
                        text: '🗑 删除',
                        on: {
                          click: () => {
                            deleteProject(p.id, p.name);
                          }
                        }
                      })
                    ]
                  })
                ]
              });
              projectList.appendChild(card);
            });
          }
        }
      } catch (error) {
        console.error('加载项目列表失败:', error);
      }
    }

    async function startProject(id) {
      try {
        showToast('正在启动项目...', 'info');
        const res = await fetch(`/api/platform/projects/${id}/start`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.code === 200) {
          showToast('项目启动成功！', 'success');
          loadProjects();
        } else {
          showToast(result.message || '启动失败', 'error');
        }
      } catch (err) {
        console.error('启动项目失败:', err);
        showToast('启动失败，请稍后重试', 'error');
      }
    }

    async function stopProject(id) {
      const confirmed = await confirm('确定要停止该项目吗？停止后学生将无法访问系统。');
      if (!confirmed) return;
      
      try {
        showToast('正在停止项目...', 'info');
        const res = await fetch(`/api/platform/projects/${id}/stop`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.code === 200) {
          showToast('项目已停止', 'success');
          loadProjects();
        } else {
          showToast(result.message || '停止失败', 'error');
        }
      } catch (err) {
        console.error('停止项目失败:', err);
        showToast('停止失败，请稍后重试', 'error');
      }
    }

    // ========== 表单提交处理 ==========
    
    document.getElementById('createProjectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('/api/platform/projects', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            name: document.getElementById('projectName').value,
            description: document.getElementById('projectDesc').value
          })
        });
        const result = await res.json();
        if (result.code === 200) {
          closeCreateProjectModal();
          loadProjects();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert('创建失败');
      }
    });

    document.getElementById('securityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const projectId = document.getElementById('securityProjectId').value;
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;

      console.log('[Security] Submitting credentials...', { projectId, username });

      // 验证邮箱格式
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(username)) {
        showToast('请输入有效的邮箱地址', 'error');
        return;
      }

      // 验证邮箱域名
      const domainValidation = validateEmailDomain(username);
      if (!domainValidation.valid) {
        showToast(domainValidation.message, 'error');
        return;
      }

      // 验证密码强度
      if (adminPasswordStrength && !adminPasswordStrength.isValid()) {
        const errors = adminPasswordStrength.getErrors();
        showToast('密码不符合要求：' + errors.join('、'), 'error');
        return;
      }

      try {
        const url = `/api/platform/projects/${projectId}/admin-credentials`;
        console.log('[Security] API URL:', url);
        console.log('[Security] Token exists:', !!token);

        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ username, password })
        });

        console.log('[Security] Response status:', res.status);
        const result = await res.json();
        console.log('[Security] Response data:', result);

        if (result.code === 200) {
          showToast('管理员凭据已更新！新账号: ' + username, 'success');
          closeSecurityModal();
        } else {
          showToast(result.message || '设置失败', 'error');
        }
      } catch (err) {
        console.error('[Security] Error:', err);
        showToast('设置失败，请稍后重试: ' + err.message, 'error');
      }
    });

    // 修改邮箱表单提交
    document.getElementById('changeEmailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newEmail = document.getElementById('newEmail').value.trim();
      const password = document.getElementById('emailConfirmPassword').value;

      // 验证邮箱格式
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(newEmail)) {
        showToast('请输入有效的邮箱地址', 'error');
        return;
      }

      try {
        const res = await fetch('/api/platform/auth/user/email', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ newEmail, password })
        });

        const result = await res.json();
        if (result.code === 200) {
          showToast('邮箱修改成功！请使用新邮箱登录', 'success');
          // 更新本地用户信息
          user.email = newEmail;
          localStorage.setItem('platformUser', JSON.stringify(user));
          closeAccountSettingsModal();
        } else {
          showToast(result.message || '修改失败', 'error');
        }
      } catch (err) {
        console.error('修改邮箱失败:', err);
        showToast('修改失败，请稍后重试', 'error');
      }
    });

    // 修改密码表单提交
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmNewPassword').value;

      // 验证新密码和确认密码一致
      if (newPassword !== confirmPassword) {
        showToast('两次输入的新密码不一致', 'error');
        return;
      }

      // 验证密码强度
      if (accountPasswordStrength && !accountPasswordStrength.isValid()) {
        const errors = accountPasswordStrength.getErrors();
        showToast('密码不符合要求：' + errors.join('、'), 'error');
        return;
      }

      try {
        const res = await fetch('/api/platform/auth/user/password', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ oldPassword, newPassword })
        });

        const result = await res.json();
        if (result.code === 200) {
          showToast('密码修改成功！请重新登录', 'success');
          setTimeout(() => {
            localStorage.clear();
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showToast(result.message || '修改失败', 'error');
        }
      } catch (err) {
        console.error('修改密码失败:', err);
        showToast('修改失败，请稍后重试', 'error');
      }
    });

    // 绑定所有事件监听器
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.addEventListener('click', logout);

    const createProjectNavBtn = document.getElementById('createProjectNavBtn');
    const createProjectHeaderBtn = document.getElementById('createProjectHeaderBtn');
    if (createProjectNavBtn) createProjectNavBtn.addEventListener('click', showCreateProjectModal);
    if (createProjectHeaderBtn) createProjectHeaderBtn.addEventListener('click', showCreateProjectModal);

    const accountSettingsNavBtn = document.getElementById('accountSettingsNavBtn');
    if (accountSettingsNavBtn) accountSettingsNavBtn.addEventListener('click', showAccountSettingsModal);

    const createProjectModalCloseBtn = document.getElementById('createProjectModalCloseBtn');
    const createProjectModalCancelBtn = document.getElementById('createProjectModalCancelBtn');
    if (createProjectModalCloseBtn) createProjectModalCloseBtn.addEventListener('click', closeCreateProjectModal);
    if (createProjectModalCancelBtn) createProjectModalCancelBtn.addEventListener('click', closeCreateProjectModal);

    const securityModalCloseBtn = document.getElementById('securityModalCloseBtn');
    const securityModalCancelBtn = document.getElementById('securityModalCancelBtn');
    if (securityModalCloseBtn) securityModalCloseBtn.addEventListener('click', closeSecurityModal);
    if (securityModalCancelBtn) securityModalCancelBtn.addEventListener('click', closeSecurityModal);

    const accountSettingsModalCloseBtn = document.getElementById('accountSettingsModalCloseBtn');
    const changeEmailCancelBtn = document.getElementById('changeEmailCancelBtn');
    const changePasswordCancelBtn = document.getElementById('changePasswordCancelBtn');
    if (accountSettingsModalCloseBtn) accountSettingsModalCloseBtn.addEventListener('click', closeAccountSettingsModal);
    if (changeEmailCancelBtn) changeEmailCancelBtn.addEventListener('click', closeAccountSettingsModal);
    if (changePasswordCancelBtn) changePasswordCancelBtn.addEventListener('click', closeAccountSettingsModal);

    // 绑定账号设置标签页切换
    document.querySelectorAll('.account-tab').forEach(tab => {
      tab.addEventListener('click', () => switchAccountTab(tab.dataset.tab));
    });

    // Auto refresh status every 30 seconds
    setInterval(loadProjects, 30000);
    loadProjects();
  </script>
</body>
</html>
