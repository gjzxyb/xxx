<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的项目 - 分科自选 SaaS 平台</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/csrf.js"></script>
  <script src="/js/safeDOM.js"></script>
  <script src="/js/passwordStrength.js"></script>
</head>
<body>
  <div class="dashboard-layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <span>SaaS 平台</span>
      </div>

      <ul class="nav-menu">
        <li class="nav-item active">
          <span>📊</span> 我的项目
        </li>
        <li class="nav-item" onclick="showCreateProjectModal()">
          <span>➕</span> 创建项目
        </li>
        <li class="nav-item">
          <span>⚙️</span> 账号设置
        </li>
      </ul>

      <div class="user-profile">
        <div class="user-avatar" id="userAvatar">U</div>
        <div style="flex: 1; overflow: hidden;">
          <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="userName">User</div>
          <div style="font-size: 0.8rem; color: var(--text-secondary);" id="userPlan">加载中...</div>
        </div>
        <button class="btn-icon" onclick="logout()" title="退出" style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">
          ⏻
        </button>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content">
      <header class="header">
        <div class="page-title">
          <h1>我的项目</h1>
          <p>管理您的分科自选系统实例</p>
        </div>
        <button class="btn btn-primary" onclick="showCreateProjectModal()">
          <span>+</span> 创建新项目
        </button>
      </header>

      <!-- 统计卡片 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="projectCount">0</div>
          <div class="stat-label">已创建项目</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="maxProjects">0</div>
          <div class="stat-label">项目配额</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="collaboratedProjects">0</div>
          <div class="stat-label">协作项目</div>
        </div>
      </div>

      <!-- 项目列表 -->
      <div class="section-header">
        <h2 style="font-size: 1.25rem;">全部项目</h2>
        <div class="filter-tabs" style="display: flex; gap: 1rem;">
          <!-- Placeholder for filters if needed -->
        </div>
      </div>

      <div class="projects-grid" id="projectList">
        <!-- Projects will be loaded here -->
      </div>
    </main>
  </div>

  <!-- 创建项目弹窗 -->
  <div class="modal-overlay" id="createProjectModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">✨ 创建新项目</h3>
        <button class="modal-close" onclick="closeCreateProjectModal()">&times;</button>
      </div>
      <form id="createProjectForm">
        <div class="form-group">
          <label class="form-label">项目名称</label>
          <input type="text" id="projectName" class="form-input" required placeholder="例如：XX中学分科系统">
        </div>
        <div class="form-group">
          <label class="form-label">项目描述</label>
          <textarea id="projectDesc" class="form-input" rows="3" placeholder="简要描述该项目的用途..."></textarea>
        </div>
        <div class="flex justify-between" style="margin-top: 2rem;">
          <button type="button" class="btn btn-secondary" onclick="closeCreateProjectModal()">取消</button>
          <button type="submit" class="btn btn-primary">立即创建</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 安全设置弹窗 -->
  <div class="modal-overlay" id="securityModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">🔐 安全设置</h3>
        <button class="modal-close" onclick="closeSecurityModal()">&times;</button>
      </div>
      <form id="securityForm">
        <input type="hidden" id="securityProjectId">
        <h4 style="margin-bottom: 1rem; color: var(--text-primary);">管理员凭据</h4>
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 1rem;">设置协作系统的管理员登录账号密码</p>
        <div class="form-group">
          <label class="form-label">管理员账号（邮箱）</label>
          <input type="email" id="adminUsername" class="form-input" required placeholder="例如：admin@example.com">
          <small style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem; display: block;">
            请输入邮箱地址，需符合平台邮箱域名限制
          </small>
        </div>
        <div class="form-group">
          <label class="form-label">管理员密码</label>
          <input type="password" id="adminPassword" class="form-input" required placeholder="8-32字符，含大小写字母和数字">
          <!-- 密码强度指示器容器 -->
          <div id="adminPasswordStrengthContainer"></div>
        </div>
        <div class="flex justify-between" style="margin-top: 2rem;">
          <button type="button" class="btn btn-secondary" onclick="closeSecurityModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存设置</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Custom Confirm Dialog -->
  <div class="modal-overlay" id="confirmDialog">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <h3 class="modal-title">⚠️ 确认操作</h3>
      </div>
      <div class="modal-body">
        <p id="confirmMessage" style="margin: 1.5rem 0; color: var(--text-primary);"></p>
      </div>
      <div class="flex justify-between" style="gap: 1rem;">
        <button type="button" class="btn btn-secondary" style="flex: 1;" id="confirmCancel">取消</button>
        <button type="button" class="btn btn-danger" style="flex: 1;" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Custom Confirm Dialog
    function showConfirm(message) {
      return new Promise((resolve) => {
        const dialog = document.getElementById('confirmDialog');
        const messageEl = document.getElementById('confirmMessage');
        const okBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');

        messageEl.textContent = message;
        dialog.classList.add('active');

        function cleanup() {
          dialog.classList.remove('active');
          okBtn.removeEventListener('click', handleOk);
          cancelBtn.removeEventListener('click', handleCancel);
        }

        function handleOk() {
          cleanup();
          resolve(true);
        }

        function handleCancel() {
          cleanup();
          resolve(false);
        }

        okBtn.addEventListener('click', handleOk);
        cancelBtn.addEventListener('click', handleCancel);
      });
    }

    // Override confirm to use custom dialog
    window.confirm = showConfirm;

    // Toast utility function
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;

      const icons = {
        success: '✓',
        error: '✗',
        warning: '⚠',
        info: 'ℹ'
      };

      toast.innerHTML = `
        <span class="toast-icon">${icons[type] || icons.info}</span>
        <span class="toast-message">${message}</span>
      `;

      container.appendChild(toast);

      // Auto remove after 3 seconds
      setTimeout(() => {
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Override alert to use toast
    window.alert = function(message) {
      showToast(message, 'info');
    };

    const token = localStorage.getItem('platform_token');
    const user = JSON.parse(localStorage.getItem('platform_user') || '{}');

    if (!token) window.location.href = 'login.html';

    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();

    // 显示用户套餐信息
    const planText = user.isSuperAdmin ? '超级管理员' :
                     user.maxProjects >= 10 ? '企业版' :
                     user.maxProjects >= 5 ? '专业版' :
                     `标准版 (${user.maxProjects}个项目)`;
    document.getElementById('userPlan').textContent = planText;

    // 加载项目列表
    async function loadProjects() {
      try {
        const response = await fetch('/api/platform/projects', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await response.json();

        if (result.code === 200) {
          const { owned, collaborated } = result.data;

          document.getElementById('projectCount').textContent = owned.length;
          document.getElementById('maxProjects').textContent = user.maxProjects;
          document.getElementById('collaboratedProjects').textContent = collaborated.length;

          const allProjects = [...owned.map(p => ({...p, type: 'owned'})), ...collaborated.map(p => ({...p, type: 'collab'}))];

          if (allProjects.length === 0) {
            const projectList = document.getElementById('projectList');
            safeDOM.empty(projectList);
            const emptyMsg = safeDOM.createElement('div', {
              className: 'empty-state',
              children: [
                safeDOM.createElement('p', { text: '还没有项目' }),
                safeDOM.createElement('p', { text: '点击右上角"新建项目"开始创建您的第一个项目' })
              ]
            });
            emptyMsg.style.cssText = 'text-align: center; padding: 4rem; color: var(--text-muted);';
            projectList.appendChild(emptyMsg);
          } else {
            const projectList = document.getElementById('projectList');
            safeDOM.empty(projectList);
            allProjects.forEach(p => {
              const statusClass = p.status === 'running' ? 'status-active' : 'status-inactive';
              const statusText = p.status === 'running' ? '运行中' : p.status === 'paused' ? '已暂停' : '已归档';
              
              const card = safeDOM.createElement('div', {
                className: 'project-card',
                children: [
                  safeDOM.createElement('div', {
                    className: 'project-header',
                    children: [
                      safeDOM.createElement('h3', { text: p.name }),
                      safeDOM.createElement('span', {
                        className: `status-badge ${statusClass}`,
                        text: statusText
                      })
                    ]
                  }),
                  safeDOM.createElement('div', {
                    className: 'project-body',
                    children: [
                      safeDOM.createElement('p', { text: p.description || '暂无描述' }),
                      safeDOM.createElement('div', {
                        className: 'project-stats',
                        children: [
                          safeDOM.createElement('span', { text: `👥 ${p.studentCount || 0} 学生` }),
                          safeDOM.createElement('span', { text: `📝 ${p.selectionCount || 0} 已选科` })
                        ]
                      })
                    ]
                  }),
                  safeDOM.createElement('div', {
                    className: 'project-footer',
                    children: [
                      safeDOM.createElement('button', {
                        className: 'btn btn-primary',
                        text: '进入管理',
                        on: {
                          click: () => {
                            window.location.href = `/admin.html?projectId=${p.id}`;
                          }
                        }
                      }),
                      safeDOM.createElement('button', {
                        className: 'btn btn-secondary',
                        text: '设置',
                        on: {
                          click: () => {
                            window.location.href = `/platform/project-settings.html?id=${p.id}`;
                          }
                        }
                      })
                    ]
                  })
                ]
              });
              projectList.appendChild(card);
            });
          }

          document.getElementById('projectList').innerHTML = allProjects.map(p => `
            <div class="project-card">
              <div class="project-header">
                <div class="project-icon">🏫</div>
                <div class="project-status status-${p.status || 'stopped'}">
                  <div class="status-dot"></div>
                  ${getStatusText(p.status)}
                </div>
              </div>

              <div class="project-name">${p.name}
                ${p.type === 'collab' ? `<span class="badge badge-info" style="font-size: 0.7rem; margin-left: 0.5rem;">${getRoleName(p.role)}</span>` : ''}
              </div>
              <div class="project-desc">${p.description || '暂无描述'}</div>

              <div class="project-meta">
                <span>Created ${new Date(p.createdAt).toLocaleDateString()}</span>
              </div>

              <div class="project-actions">
                ${getProjectActions(p)}
              </div>
            </div>
          `).join('');
        }
      } catch (error) {
        console.error('加载项目列表失败:', error);
      }
    }

    function getRoleName(role) {
      return { owner: '所有者', admin: '管理员', collaborator: '协作者' }[role] || role;
    }

    function getStatusText(status) {
      const map = {
        running: '运行中',
        stopped: '已停止',
        starting: '启动中',
        error: '错误'
      };
      return map[status] || '未知';
    }

    function getProjectActions(p) {
      const securityBtn = p.type === 'owned' ? `<button class="action-btn" onclick="showSecurityModal('${p.id}')" style="background: var(--bg-hover);">🔐 设置</button>` : '';

      if (p.status === 'running') {
        // 运行中：显示"进入系统"按钮，跳转到项目登录页面
        return `
          <button class="action-btn btn-access" onclick="window.open('/?projectId=${p.id}', '_blank')">进入系统</button>
          <button class="action-btn btn-stop" onclick="stopProject('${p.id}')">禁用</button>
          ${securityBtn}
        `;
      } else if (p.status === 'starting') {
        return '<button class="action-btn btn-stop" disabled>启动中...</button>';
      } else {
        // 停止状态：显示"启用"和"删除"按钮
        return `
          <button class="action-btn btn-start" onclick="startProject('${p.id}')">启用</button>
          ${securityBtn}
          <button class="action-btn btn-stop" onclick="deleteProject('${p.id}', '${p.name}')">删除</button>
        `;
      }
    }

    async function startProject(id) {
      const btn = event.target;
      const originalText = btn.textContent;
      btn.textContent = '启动中...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/platform/projects/${id}/start`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.code === 200) {
          // 乐观更新
          loadProjects();
        } else {
          alert(result.message || '启动失败');
          btn.textContent = originalText;
          btn.disabled = false;
        }
      } catch (err) {
        alert('启动失败');
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    async function stopProject(id) {
      if (!confirm('确定要停止该项目吗？')) return;
      try {
        const res = await fetch(`/api/platform/projects/${id}/stop`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.code === 200) {
          loadProjects();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert('停止失败');
      }
    }

    function showCreateProjectModal() {
      if (parseInt(document.getElementById('projectCount').textContent) >= user.maxProjects) {
        alert(`已达到项目数量上限（${user.maxProjects}个）`);
        return;
      }
      document.getElementById('createProjectModal').classList.add('active');
    }

    function closeCreateProjectModal() {
      document.getElementById('createProjectModal').classList.remove('active');
    }

    document.getElementById('createProjectForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('/api/platform/projects', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            name: document.getElementById('projectName').value,
            description: document.getElementById('projectDesc').value
          })
        });
        const result = await res.json();
        if (result.code === 200) {
          closeCreateProjectModal();
          loadProjects();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert('创建失败');
      }
    });

    async function deleteProject(id, name) {
      if (!confirm(`确定要删除项目"${name}"吗？此操作不可恢复！`)) return;
      try {
        const res = await fetch(`/api/platform/projects/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.code === 200) {
          loadProjects();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert('删除失败');
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    // 安全设置弹窗
    let adminPasswordStrength = null;
    let allowedEmailDomains = [];
    
    // 加载允许的邮箱域名配置
    async function loadEmailDomainConfig() {
      try {
        const res = await fetch('/api/platform/superadmin/settings', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const result = await res.json();
        if (result.code === 200) {
          const domainsSetting = result.data.find(s => s.key === 'allowed_email_domains');
          if (domainsSetting && domainsSetting.value) {
            allowedEmailDomains = domainsSetting.value.split(',').map(d => d.trim()).filter(d => d);
          } else {
            allowedEmailDomains = []; // 空表示不限制
          }
        }
      } catch (err) {
        console.warn('获取邮箱域名配置失败，将不限制邮箱域名', err);
        allowedEmailDomains = [];
      }
    }
    
    // 验证邮箱域名
    function validateEmailDomain(email) {
      if (!email || !email.includes('@')) {
        return { valid: false, message: '请输入有效的邮箱地址' };
      }
      
      // 如果没有设置域名限制，则不验证
      if (allowedEmailDomains.length === 0) {
        return { valid: true };
      }
      
      const emailDomain = email.split('@')[1];
      if (!allowedEmailDomains.includes(emailDomain)) {
        return { 
          valid: false, 
          message: `邮箱域名不在允许列表中。允许的域名：${allowedEmailDomains.join(', ')}` 
        };
      }
      
      return { valid: true };
    }
    
    function showSecurityModal(projectId) {
      document.getElementById('securityProjectId').value = projectId;
      document.getElementById('adminUsername').value = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('securityModal').classList.add('active');
      
      // 初始化密码强度指示器
      if (adminPasswordStrength) {
        adminPasswordStrength.destroy();
      }
      adminPasswordStrength = new PasswordStrengthIndicator({
        passwordInput: document.getElementById('adminPassword'),
        container: document.getElementById('adminPasswordStrengthContainer')
      });
      
      // 加载邮箱域名配置
      loadEmailDomainConfig();
    }

    function closeSecurityModal() {
      document.getElementById('securityModal').classList.remove('active');
    }

    document.getElementById('securityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const projectId = document.getElementById('securityProjectId').value;
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;

      console.log('[Security] Submitting credentials...', { projectId, username });

      // 验证邮箱格式
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(username)) {
        showToast('请输入有效的邮箱地址', 'error');
        return;
      }

      // 验证邮箱域名
      const domainValidation = validateEmailDomain(username);
      if (!domainValidation.valid) {
        showToast(domainValidation.message, 'error');
        return;
      }

      // 验证密码强度
      if (adminPasswordStrength && !adminPasswordStrength.isValid()) {
        const errors = adminPasswordStrength.getErrors();
        showToast('密码不符合要求：' + errors.join('、'), 'error');
        return;
      }

      try {
        const url = `/api/platform/projects/${projectId}/admin-credentials`;
        console.log('[Security] API URL:', url);
        console.log('[Security] Token exists:', !!token);

        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ username, password })
        });

        console.log('[Security] Response status:', res.status);
        const result = await res.json();
        console.log('[Security] Response data:', result);

        if (result.code === 200) {
          showToast('管理员凭据已更新！新账号: ' + username, 'success');
          closeSecurityModal();
        } else {
          showToast(result.message || '设置失败', 'error');
        }
      } catch (err) {
        console.error('[Security] Error:', err);
        showToast('设置失败，请稍后重试: ' + err.message, 'error');
      }
    });

    // Auto refresh status every 30 seconds
    setInterval(loadProjects, 30000);
    loadProjects();
  </script>
</body>
</html>
