<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生分科自选系统 - 登录</title>
  <meta name="description" content="新高考3+1+2选科系统，学生自主选科平台">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card animate-fadeIn">
      <div class="login-header">
        <div class="login-logo">📚</div>
        <h1 class="login-title">分科自选系统</h1>
        <p class="login-subtitle">新高考 3+1+2 选科平台</p>
      </div>

      <div id="alertBox" class="alert hidden"></div>

      <!-- 登录方式切换 -->
      <div class="login-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: var(--bg-secondary); border-radius: var(--radius-sm); padding: 0.25rem;">
        <button type="button" class="login-tab active" id="tabPassword" style="flex: 1; padding: 0.75rem; border: none; background: var(--primary); color: white; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; transition: var(--transition);">
          密码登录
        </button>
        <button type="button" class="login-tab" id="tabCode" style="flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--text-secondary); border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; transition: var(--transition);">
          验证码登录
        </button>
      </div>

      <!-- 密码登录表单 -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">学号 / 账号</label>
          <input type="text" id="studentId" class="form-input" placeholder="请输入学号" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="rememberMe">
            <span style="color: var(--text-secondary); font-size: 0.9rem;">记住登录状态</span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          登 录
        </button>
      </form>

      <!-- 验证码登录表单 -->
      <form id="codeLoginForm" class="hidden">
        <div class="form-group">
          <label class="form-label">邮箱地址</label>
          <input type="email" id="emailInput" class="form-input" placeholder="请输入绑定的邮箱" required>
        </div>
        <div class="form-group">
          <label class="form-label">验证码</label>
          <div style="display: flex; gap: 0.75rem;">
            <input type="text" id="codeInput" class="form-input" placeholder="请输入6位验证码" maxlength="6" required style="flex: 1;">
            <button type="button" id="sendCodeBtn" class="btn btn-secondary" style="white-space: nowrap; min-width: 120px;">
              获取验证码
            </button>
          </div>
          <div id="codeHint" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; display: none;">
            验证码已发送，5分钟内有效
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          登 录
        </button>
      </form>

      <div class="mt-3 text-center">
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          还没有账号？<a href="#" id="showRegister">立即注册</a>
        </p>
      </div>

      <!-- 注册表单 -->
      <form id="registerForm" class="hidden">
        <div class="form-group">
          <label class="form-label">学号</label>
          <input type="text" id="regStudentId" class="form-input" placeholder="请输入学号" required>
        </div>
        <div class="form-group">
          <label class="form-label">姓名</label>
          <input type="text" id="regName" class="form-input" placeholder="请输入真实姓名" required>
        </div>
        <div class="form-group">
          <label class="form-label">班级</label>
          <input type="text" id="regClassName" class="form-input" placeholder="如：高一(1)班">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" id="regPassword" class="form-input" placeholder="请设置密码" required>
          <!-- 密码强度指示器容器 -->
          <div id="regPasswordStrengthContainer"></div>
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" id="regConfirmPassword" class="form-input" placeholder="请再次输入密码" required>
        </div>
        <button type="submit" class="btn btn-success btn-lg" style="width: 100%;">
          注 册
        </button>
        <div class="mt-3 text-center">
          <a href="#" id="showLogin">返回登录</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/passwordStrength.js"></script>
  <script>
    // 检查是否已登录
    if (isLoggedIn()) {
      const user = getCurrentUser();
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('projectId');

      if (projectId) {
        // 如果URL中有projectId，重定向时保留它
        if (user && user.role === 'admin') {
          window.location.href = `/admin.html?projectId=${projectId}`;
        } else {
          window.location.href = `/dashboard.html?projectId=${projectId}`;
        }
      } else {
        // 如果没有projectId，重定向到平台首页让用户选择项目
        window.location.href = '/platform/dashboard.html';
      }
    }

    const loginForm = document.getElementById('loginForm');
    const codeLoginForm = document.getElementById('codeLoginForm');
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const tabPassword = document.getElementById('tabPassword');
    const tabCode = document.getElementById('tabCode');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const codeHint = document.getElementById('codeHint');

    // 倒计时相关
    let countdown = 0;
    let countdownTimer = null;

    // 获取 CSRF Token
    function getCsrfToken() {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        const [name, value] = cookie.trim().split('=');
        if (name === 'CSRF-TOKEN') {
          return value;
        }
      }
      return null;
    }

    // 初始化密码强度指示器
    let registerPasswordStrength = null;
    // 在 DOM 加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof PasswordStrengthIndicator !== 'undefined') {
        registerPasswordStrength = new PasswordStrengthIndicator({
          passwordInput: document.getElementById('regPassword'),
          confirmInput: document.getElementById('regConfirmPassword'),
          container: document.getElementById('regPasswordStrengthContainer')
        });
      }
    });

    // 显示提示
    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.classList.remove('hidden');
      setTimeout(() => alertBox.classList.add('hidden'), 5000);
    }

    // 登录方式切换
    tabPassword.addEventListener('click', () => {
      tabPassword.classList.add('active');
      tabCode.classList.remove('active');
      tabPassword.style.background = 'var(--primary)';
      tabPassword.style.color = 'white';
      tabCode.style.background = 'transparent';
      tabCode.style.color = 'var(--text-secondary)';
      loginForm.classList.remove('hidden');
      codeLoginForm.classList.add('hidden');
    });

    tabCode.addEventListener('click', () => {
      tabCode.classList.add('active');
      tabPassword.classList.remove('active');
      tabCode.style.background = 'var(--primary)';
      tabCode.style.color = 'white';
      tabPassword.style.background = 'transparent';
      tabPassword.style.color = 'var(--text-secondary)';
      codeLoginForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
    });

    // 发送验证码
    sendCodeBtn.addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      
      if (!email) {
        showAlert('请输入邮箱地址', 'warning');
        return;
      }

      // 验证邮箱格式
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert('请输入有效的邮箱地址', 'warning');
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('projectId');

      if (!projectId) {
        showAlert('缺少项目信息', 'danger');
        return;
      }

      try {
        sendCodeBtn.disabled = true;
        sendCodeBtn.textContent = '发送中...';

        const csrfToken = getCsrfToken();
        const response = await fetch('/api/auth/send-verification-code', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({ email, projectId })
        });

        const result = await response.json();

        if (result.code === 200) {
          showAlert('验证码已发送到您的邮箱', 'success');
          codeHint.style.display = 'block';
          
          // 开始倒计时
          countdown = 60;
          startCountdown();
        } else {
          showAlert(result.message || '发送失败', 'danger');
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '获取验证码';
        }
      } catch (error) {
        console.error('发送验证码失败:', error);
        showAlert('发送失败，请检查网络连接', 'danger');
        sendCodeBtn.disabled = false;
        sendCodeBtn.textContent = '获取验证码';
      }
    });

    // 倒计时功能
    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      
      countdownTimer = setInterval(() => {
        countdown--;
        sendCodeBtn.textContent = `${countdown}秒后重试`;
        
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = '获取验证码';
        }
      }, 1000);
    }

    // 验证码登录提交
    codeLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('emailInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('projectId');

      if (!email || !code) {
        showAlert('请输入邮箱和验证码', 'warning');
        return;
      }

      if (!projectId) {
        showAlert('缺少项目信息', 'danger');
        return;
      }

      try {
        const submitBtn = codeLoginForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = '登录中...';

        const csrfToken = getCsrfToken();
        const response = await fetch('/api/auth/login-with-code', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken
          },
          body: JSON.stringify({ email, code, projectId })
        });

        const result = await response.json();

        if (result.code === 200) {
          // 登录成功
          setToken(result.data.token);
          setCurrentUser(result.data.user);
          
          showAlert('登录成功！', 'success');
          
          // 跳转
          setTimeout(() => {
            if (result.data.user.role === 'admin') {
              window.location.href = `/admin.html?projectId=${projectId}`;
            } else {
              window.location.href = `/dashboard.html?projectId=${projectId}`;
            }
          }, 500);
        } else {
          showAlert(result.message || '登录失败', 'danger');
          submitBtn.disabled = false;
          submitBtn.textContent = '登 录';
        }
      } catch (error) {
        console.error('登录失败:', error);
        showAlert('登录失败，请稍后重试', 'danger');
        const submitBtn = codeLoginForm.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
      }
    });

    // 检查注册状态
    async function checkRegistrationStatus() {
      try {
        const response = await fetch('/api/auth/registration-status');
        const result = await response.json();

        if (result.code === 200 && result.data.registrationEnabled === false) {
          // 注册已关闭
          const registerLink = document.getElementById('showRegister');
          registerLink.textContent = '注册已关闭';
          registerLink.style.color = 'var(--text-muted)';
          registerLink.style.cursor = 'not-allowed';
          registerLink.style.pointerEvents = 'none';
          registerLink.style.textDecoration = 'none';
        }
      } catch (error) {
        console.error('检查注册状态失败:', error);
        // 发生错误时不影响用户体验，默认允许注册
      }
    }

    // 立即执行检查
    checkRegistrationStatus();

    // 切换表单 - 显示注册
    function handleShowRegister(e) {
      e.preventDefault();
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
    }
    document.getElementById('showRegister').addEventListener('click', handleShowRegister);

    // 切换表单 - 返回登录
    document.getElementById('showLogin').addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    // 登录
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const studentId = document.getElementById('studentId').value.trim();
      const password = document.getElementById('password').value;

      if (!studentId || !password) {
        showAlert('请输入学号和密码');
        return;
      }

      // 获取 projectId (从 URL 参数)
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('projectId');

      if (!projectId) {
        showAlert('缺少项目信息，请通过正确的链接访问');
        return;
      }

      const btn = loginForm.querySelector('button');
      btn.disabled = true;
      btn.textContent = '登录中...';

      const result = await api.auth.login(studentId, password, projectId);

      if (result && result.code === 200) {
        setToken(result.data.token);
        setCurrentUser(result.data.user);

        // 跳转时保留 projectId 参数
        if (result.data.user.role === 'admin') {
          window.location.href = `/admin.html?projectId=${projectId}`;
        } else {
          window.location.href = `/dashboard.html?projectId=${projectId}`;
        }
      } else {
        showAlert(result?.message || '登录失败，请稍后重试');
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });

    // 注册
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const studentId = document.getElementById('regStudentId').value.trim();
      const name = document.getElementById('regName').value.trim();
      const className = document.getElementById('regClassName').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (!studentId || !name || !password) {
        showAlert('请填写必要信息');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('两次密码输入不一致');
        return;
      }

      // 验证密码强度
      if (registerPasswordStrength && !registerPasswordStrength.isValid()) {
        const errors = registerPasswordStrength.getErrors();
        showAlert('密码不符合要求：\n' + errors.join('、'));
        return;
      }

      const btn = registerForm.querySelector('button');
      btn.disabled = true;
      btn.textContent = '注册中...';

      const result = await api.auth.register({ studentId, name, className, password });

      if (result.code === 200) {
        setToken(result.data.token);
        setCurrentUser(result.data.user);
        window.location.href = '/dashboard.html';
      } else {
        showAlert(result.message);
        btn.disabled = false;
        btn.textContent = '注 册';
      }
    });
  </script>

  <!-- PWA Service Worker -->
  <script src="/js/pwa.js"></script>
</body>
</html>
